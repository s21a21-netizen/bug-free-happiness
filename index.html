<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下手ウマ・トークリサイタル</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.5rem;
            color: #ff5722;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #ff5722;
            outline: none;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: left;
        }
        .controls label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .controls div {
            flex: 1;
            margin: 0 5px;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        button:hover {
            background-color: #e64a19;
        }
        button:active {
            transform: scale(0.98);
        }
        .notice {
            font-size: 0.8rem;
            color: #777;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎤 下手ウマ・トークリサイタル</h1>
        <textarea id="textInput" placeholder="ここに喋らせたい言葉を入力してね（例：ちょうちょう、ちょうちょう、菜の葉にとまれ）">こんにちは、全音ブラボーの世界へようこそ！</textarea>
        
        <div class="controls">
            <div>
                <label for="wobbleRate">揺れ幅 (ビブラート): <span id="wobbleVal">5</span>Hz</label>
                <input type="range" id="wobbleRate" min="0" max="15" value="5" step="0.5">
            </div>
            <div>
                <label for="pitchSpeed">スピード: <span id="speedVal">1.0</span>x</label>
                <input type="range" id="pitchSpeed" min="0.5" max="2.0" value="1.0" step="0.1">
            </div>
        </div>

        <button id="speakBtn">リサイタル開演！</button>
        <div class="notice">※ブラウザの音声合成機能を使用しています。環境によっては声が出ない場合があります。</div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const speakBtn = document.getElementById('speakBtn');
        const wobbleRateInput = document.getElementById('wobbleRate');
        const speedVal = document.getElementById('speedVal');
        const wobbleVal = document.getElementById('wobbleVal');

        wobbleRateInput.addEventListener('input', (e) => {
            wobbleVal.textContent = e.target.value;
        });

        document.getElementById('pitchSpeed').addEventListener('input', (e) => {
            speedVal.textContent = e.target.value;
        });

        speakBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) return;

            if (!('speechSynthesis' in window)) {
                alert('お使いのブラウザは音声合成に対応していません。');
                return;
            }

            // 既存の音声をストップ
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = parseFloat(document.getElementById('pitchSpeed').value);
            utterance.pitch = 1.2; // 少し高めのボイスベース

            // 日本語の音声を探して設定
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(v => v.lang.includes('ja') || v.lang.includes('JA'));
            if (jpVoice) {
                utterance.voice = jpVoice;
            }

            // Web Audio API を使ったぐにゃぐにゃエフェクトの構築
            // ※ブラウザの仕様上、SpeechSynthesisの生出力を直接Web AudioのNodeにルーティングするのは制限があるため、
            //   ここでは音声合成に合わせて疑似的に「あの不穏なビブラート音やピッチの変化」を重ねるか、
            //   あるいはWeb Audioのオシレーター（シンセ）でメロディっぽく鳴らすアプローチが安定します。
            // 今回はシンプルに、リサイタルっぽさを出すために音声合成と同時にシンセ音を裏で鳴らす演出にしています！
            
            playRecitalBGM(text.length * 300); // 雰囲気用の演出

            window.speechSynthesis.speak(utterance);
        });

        // リサイタル感を出すための簡易シンセ・ビブラート演出
        function playRecitalBGM(duration) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const lfo = ctx.createOscillator();
                const lfoGain = ctx.createGain();

                const wobble = parseFloat(wobbleRateInput.value);

                // メインの音（ちょっと外れたレトロな矩形波やノコギリ波）
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(330, ctx.currentTime); // E4あたり

                // ピッチを揺らすLFO（ビブラート）
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(wobble, ctx.currentTime);
                lfoGain.gain.setValueAtTime(40, ctx.currentTime); // 揺れの幅

                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);

                // 音量調整
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (duration / 1000));

                osc.connect(gain);
                gain.connect(ctx.destination);

                lfo.start();
                osc.start();
                lfo.stop(ctx.currentTime + (duration / 1000));
                osc.stop(ctx.currentTime + (duration / 1000));
            } catch (e) {
                console.log(e);
            }
        }
    </script>
</body>
</html>
