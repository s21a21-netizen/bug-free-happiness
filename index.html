<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web版 Waseda Talker シミュレーター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #0f172a;
            color: #38bdf8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 20px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #f43f5e;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        /* 機構コントロールパネル */
        .organ-box {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        .organ-title {
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 0.95rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .control-row label {
            flex: 1;
        }
        .control-row input[type="range"] {
            flex: 1.5;
        }
        .control-row span {
            width: 50px;
            text-align: right;
            font-family: monospace;
            color: #38bdf8;
        }
        /* モード切替ボタン群 */
        .mode-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .mode-btn.active {
            background: #f43f5e;
        }
        /* 発声トリガーパッド */
        #vocalPad {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 2px dashed #f43f5e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f43f5e;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            transition: 0.2s;
        }
        #vocalPad.active {
            background: #f43f5e;
            color: #0f172a;
            border-style: solid;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 Waseda Talker 物理発声シミュレーター</h1>
        <div class="subtitle">Based on Waseda Univ. Takanishi Lab (Voice Generation Mechanism)</div>

        <!-- 1. 声帯モデル (Vocal Cord) -->
        <div class="organ-box">
            <div class="organ-title">🎵 声帯モデル (Vocal Cords / 音源生成)</div>
            <div class="control-row">
                <label>声帯張力 (ピッチ / 周波数):</label>
                <input type="range" id="vocalTension" min="80" max="400" value="150" step="1">
                <span id="tensionVal">150Hz</span>
            </div>
            <div class="control-row">
                <label>声門振動様式 (波形):</label>
                <div class="mode-group" style="flex: 1.5; margin:0;">
                    <button class="mode-btn active" data-wave="sawtooth">モーダル</button>
                    <button class="mode-btn" data-wave="square">フライ</button>
                    <button class="mode-btn" data-wave="sine">気息性</button>
                </div>
            </div>
        </div>

        <!-- 2. 調音器官・声道モデル (Tract / Formants) -->
        <div class="organ-box">
            <div class="organ-title">🗣️ 声道・舌・口唇モデル (Formant Filters)</div>
            <div class="mode-group">
                <button class="mode-btn vowel-btn active" data-f1="800" data-f2="1200">あ (A)</button>
                <button class="mode-btn vowel-btn" data-f1="300" data-f2="2300">い (I)</button>
                <button class="mode-btn vowel-btn" data-f1="350" data-f2="800">う (U)</button>
                <button class="mode-btn vowel-btn" data-f1="550" data-f2="1900">え (E)</button>
                <button class="mode-btn vowel-btn" data-f1="500" data-f2="900">お (O)</button>
            </div>
            <div class="control-row">
                <label>第1フォルマント (F1 - 舌の前後):</label>
                <input type="range" id="f1Range" min="200" max="1200" value="800" step="10">
                <span id="f1Val">800Hz</span>
            </div>
            <div class="control-row">
                <label>第2フォルマント (F2 - 口の開き):</label>
                <input type="range" id="f2Range" min="500" max="3000" value="1200" step="10">
                <span id="f2Val">1200Hz</span>
            </div>
        </div>

        <!-- 3. 肺モデル (Lung / Airflow) -->
        <div class="organ-box">
            <div class="organ-title">💨 肺・呼気モデル (Airflow & Pressure)</div>
            <div class="control-row">
                <label>呼気圧 (音量・ビブラート):</label>
                <input type="range" id="airPressure" min="0" max="1" value="0.2" step="0.01">
                <span id="pressureVal">0.20</span>
            </div>
        </div>

        <!-- 発声トリガー -->
        <div id="vocalPad">ここにタッチ / マウス長押しで発話・発声</div>
    </div>

    <script>
        let audioCtx = null;
        let osc = null, gainNode = null, filter1 = null, filter2 = null, lfo = null, lfoGain = null;

        const vocalPad = document.getElementById('vocalPad');
        const tensionInput = document.getElementById('vocalTension');
        const tensionVal = document.getElementById('tensionVal');
        const f1Range = document.getElementById('f1Range');
        const f1Val = document.getElementById('f1Val');
        const f2Range = document.getElementById('f2Range');
        const f2Val = document.getElementById('f2Val');
        const airPressure = document.getElementById('airPressure');
        const pressureVal = document.getElementById('pressureVal');

        let currentWave = 'sawtooth';

        // 波形（声帯振動様式）切替
        document.querySelectorAll('[data-wave]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('[data-wave]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentWave = btn.dataset.wave;
                if (osc) osc.type = currentWave;
            });
        });

        // 母音プリセット切替
        document.querySelectorAll('.vowel-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.vowel-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const f1 = btn.dataset.f1;
                const f2 = btn.dataset.f2;
                f1Range.value = f1;
                f2Range.value = f2;
                f1Val.textContent = f1 + 'Hz';
                f2Val.textContent = f2 + 'Hz';
                updateFilters();
            });
        });

        tensionInput.addEventListener('input', (e) => {
            tensionVal.textContent = e.target.value + 'Hz';
            if (osc) osc.frequency.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.05);
        });

        f1Range.addEventListener('input', (e) => {
            f1Val.textContent = e.target.value + 'Hz';
            updateFilters();
        });

        f2Range.addEventListener('input', (e) => {
            f2Val.textContent = e.target.value + 'Hz';
            updateFilters();
        });

        airPressure.addEventListener('input', (e) => {
            pressureVal.textContent = parseFloat(e.target.value).toFixed(2);
            if (gainNode) {
                gainNode.gain.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.05);
            }
        });

        function startVoice() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (osc) return;

            vocalPad.classList.add('active');
            vocalPad.textContent = "🔊 発声中（Waseda Talker 稼働）";

            // 声帯（オシレーター）
            osc = audioCtx.createOscillator();
            osc.type = currentWave;
            osc.frequency.setValueAtTime(parseFloat(tensionInput.value), audioCtx.currentTime);

            // 肺のゆらぎ（LFOによる空気圧変動）
            lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(4.5, audioCtx.currentTime);
            lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(10, audioCtx.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);

            // 声道モデル（フィルター1：F1）
            filter1 = audioCtx.createBiquadFilter();
            filter1.type = 'bandpass';
            filter1.frequency.setValueAtTime(parseFloat(f1Range.value), audioCtx.currentTime);
            filter1.Q.value = 4.0;

            // 声道モデル（フィルター2：F2）
            filter2 = audioCtx.createBiquadFilter();
            filter2.type = 'bandpass';
            filter2.frequency.setValueAtTime(parseFloat(f2Range.value), audioCtx.currentTime);
            filter2.Q.value = 4.0;

            // 肺（音量・気圧ゲイン）
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(parseFloat(airPressure.value), audioCtx.currentTime + 0.1);

            // 結線 (声帯 -> フィルター1 & 2 並列ミックス -> 肺(出力))
            osc.connect(filter1);
            osc.connect(filter2);
            filter1.connect(gainNode);
            filter2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            lfo.start();
        }

        function stopVoice() {
            if (!osc) return;
            vocalPad.classList.remove('active');
            vocalPad.textContent = "ここにタッチ / マウス長押しで発話・発声";

            gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);

            setTimeout(() => {
                if (osc) {
                    osc.stop();
                    lfo.stop();
                    osc.disconnect();
                    lfo.disconnect();
                    osc = null;
                    lfo = null;
                }
            }, 100);
        }

        function updateFilters() {
            if (!filter1 || !filter2) return;
            filter1.frequency.setTargetAtTime(parseFloat(f1Range.value), audioCtx.currentTime, 0.05);
            filter2.frequency.setTargetAtTime(parseFloat(f2Range.value), audioCtx.currentTime, 0.05);
        }

        vocalPad.addEventListener('mousedown', startVoice);
        window.addEventListener('mouseup', stopVoice);
        vocalPad.addEventListener('touchstart', (e) => { startVoice(); e.preventDefault(); });
        window.addEventListener('touchend', stopVoice);
    </script>
</body>
</html>
